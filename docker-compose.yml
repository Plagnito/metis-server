services:
  metis:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4880:4880"
    volumes:
      - metis-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  metis-data:
